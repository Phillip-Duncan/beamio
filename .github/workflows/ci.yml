name: CI

on:
  push:
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
        required: false
      revision:
        type: string
        default: ""
        required: false
      artifact-name:
        type: string
        default: distributions
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Byte-compile source tree
        run: python -m compileall -q src
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check metadata, archive contents, and release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python tools/check_dist.py --tag "$RELEASE_TAG"
      - name: Rebuild and test the source distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m pip install --no-index --no-deps --find-links rebuilt beamio
          python -m pip install "pytest>=8.0" "numpy>=2.1.3"
          python -m pip check
          python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name || 'distributions' }}
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        numpy: ["numpy>=2.1.3"]
        include:
          - os: windows-latest
            python: "3.12"
            numpy: "numpy>=2.1.3"
          - os: macos-latest
            python: "3.12"
            numpy: "numpy>=2.1.3"
          - os: ubuntu-latest
            python: "3.12"
            numpy: "numpy==2.1.3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name || 'distributions' }}
          path: dist
      - name: Install the built wheel and test dependencies
        env:
          NUMPY_REQUIREMENT: ${{ matrix.numpy }}
        run: |
          python -m pip install --upgrade "pytest>=8.0" "$NUMPY_REQUIREMENT"
          python -m pip install --no-index --no-deps --find-links dist beamio
          python -m pip check
        shell: bash
      - run: python -m pytest
