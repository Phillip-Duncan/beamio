[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "beamio"
version = "0.2.0"
description = "Read, write, and convert radiotherapy beam measurements"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Phillip Duncan-Gelder", email = "phillip.duncan-gelder@southerndhb.govt.nz"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
keywords = ["radiotherapy", "beam-data", "IBA", "RayStation"]
dependencies = [
    "numpy>=2.1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "build>=1.2",
    "twine>=6.1",
    "python-semantic-release>=10.5.3,<11",
]

[project.urls]
Homepage = "https://github.com/Phillip-Duncan/beamio"
Repository = "https://github.com/Phillip-Duncan/beamio"
Issues = "https://github.com/Phillip-Duncan/beamio/issues"
Documentation = "https://github.com/Phillip-Duncan/beamio/tree/main/docs"
Changelog = "https://github.com/Phillip-Duncan/beamio/blob/main/RELEASE_NOTES.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["beamio*"]
namespaces = false

[tool.semantic_release]
allow_zero_version = true
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "dev/templates/release_notes"
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''build(?:\([^)]*?\))?: .+''',
    '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "RELEASE_NOTES.md"
mask_initial_release = false
output_format = "md"

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib -v --tb=short -m 'not slow and not performance'"
markers = [
    "slow: long-running tests (run explicitly with pytest -m slow)",
    "integration: exercises collaborating components or a complete conversion pipeline",
    "e2e: exercises a complete application workflow",
    "performance: synthetic scale and performance tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
